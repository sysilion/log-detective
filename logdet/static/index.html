<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log Detective</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e2db;--acc:#7c3aed;--bad:#dc2626;--bar:#94a3b8}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--mute:#9c9a92;--line:#33322e;--acc:#a78bfa;--bad:#f87171;--bar:#64748b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:920px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
form{display:flex;gap:8px}input{flex:1;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{font:inherit;padding:0 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}button:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 20px}.chip{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.meta{font-size:12px;color:var(--mute)}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile .v{font-size:22px;font-weight:600}.tile .k{font-size:12px;color:var(--mute)}
.answer{white-space:pre-wrap}.answer b{font-weight:650}.answer code{font:13px ui-monospace,Menlo,monospace;background:var(--line);padding:1px 5px;border-radius:5px}.cite{color:var(--acc);font-weight:600}
.ev{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;border-top:1px solid var(--line);padding:6px 0;overflow-wrap:anywhere}
.ev b{color:var(--acc)}.why{color:var(--mute)}svg{width:100%;height:120px;display:block}
.err{color:var(--bad)}
</style>
</head>
<body>
<main>
  <h1>🔎 Log Detective</h1>
  <p class="sub">Ask your logs why things broke. Runs on a Fly.io Sprite · Pinecone + Gemini via Sprites connectors.</p>
  <form id="f"><input id="q" placeholder="어제 새벽 3시에 왜 느려졌어?  /  Why did checkout slow down at 3am yesterday?" autocomplete="off"><button id="b">Ask</button></form>
  <div class="chips" id="chips"></div>
  <div id="out"></div>
  <p class="meta" id="health"></p>
</main>
<script>
const EX=["어제 새벽 3시에 왜 느려졌어?","Why did checkout slow down at 3am yesterday?","어제 새벽 1시 반쯤 결제 경고는 뭐였어?","What happened yesterday?"];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=t=>esc(t).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>")
 .replace(/\[(E\d+(?:\s*[,\-–]\s*E\d+)*)\]/g,'<span class="cite">[$1]</span>');
const ms=v=>v==null?"–":v>=1000?(v/1000).toFixed(1)+"s":Math.round(v)+"ms";
EX.forEach(e=>{const c=document.createElement("button");c.type="button";c.className="chip";c.textContent=e;c.onclick=()=>{$("#q").value=e;ask()};$("#chips").append(c)});
fetch("api/health").then(r=>r.json()).then(h=>{$("#health").textContent=`${h.events} events · ${h.chunks} chunks indexed · tz ${h.tz}`+(h.range?` · ${h.range[0].slice(0,16)} → ${h.range[1].slice(0,16)}`:"")+(h.now?` · demo clock pinned to ${h.now.slice(0,16)} (so "yesterday" = the sample incident day)`:"")}).catch(()=>{});
$("#f").onsubmit=e=>{e.preventDefault();ask()};
function chart(st){const tl=st.timeline;if(!tl.length)return"";const W=900,H=120,mx=Math.max(...tl.map(m=>m.p95||0))||1,bw=W/tl.length,a=st.anomaly;
 let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="p95 latency per minute">`;
 if(a){const i0=tl.findIndex(m=>m.t>=a.start),i1=tl.findIndex(m=>m.t>=a.end);s+=`<rect x="${i0*bw}" y="0" width="${((i1<0?tl.length:i1)-i0)*bw}" height="${H}" fill="var(--bad)" opacity=".10"/>`}
 tl.forEach((m,i)=>{const h=(m.p95||0)/mx*(H-6);s+=`<rect x="${i*bw+.5}" y="${H-h}" width="${Math.max(bw-1,1)}" height="${h}" fill="${m.err?'var(--bad)':'var(--bar)'}"><title>${new Date(m.t*1000).toLocaleTimeString()} p95 ${ms(m.p95)} · ${m.err}/${m.n} 5xx</title></rect>`});
 return s+"</svg>"}
async function ask(){const q=$("#q").value.trim();if(!q)return;$("#b").disabled=true;$("#out").innerHTML=`<div class="card meta">Investigating… (stats → Pinecone retrieval → Ollama)</div>`;
 try{const r=await fetch("api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q})});const d=await r.json();if(d.error)throw new Error(d.error);
  const st=d.stats,w=st.window,b=st.baseline,a=st.anomaly;
  const tiles=[["p95 latency",ms(w.p95),"baseline "+ms(b.p95)],["peak p95",a?ms(a.peak_p95):"–",a?"at "+new Date(a.peak*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"no anomaly"],["5xx rate",(w.error_rate*100).toFixed(1)+"%","baseline "+(b.error_rate*100).toFixed(1)+"%"],["requests",w.requests,w.lines+" log lines"]];
  $("#out").innerHTML=`<div class="tiles">${tiles.map(t=>`<div class="card tile"><div class="k">${t[0]}</div><div class="v">${esc(t[1])}</div><div class="k">${esc(t[2])}</div></div>`).join("")}</div>
  <div class="card"><div class="meta">p95 latency per minute · ${esc(d.range.label)}</div>${chart(st)}</div>
  <div class="card"><div class="answer">${md(d.answer)}</div>
  <p class="meta">llm: ${esc(d.llm)} · vector: ${esc(d.vector)} · embed: ${esc(d.embed)} · ${d.elapsed_ms} ms${d.llm_error?` · <span class="err">LLM error: ${esc(d.llm_error)}</span>`:""}</p></div>
  <div class="card"><div class="meta">Evidence</div>${d.evidence.map(e=>`<div class="ev"><b>[${e.cite}]</b> ${esc(e.source)}:${e.lineno} <span class="why">· ${esc(e.why)}</span><br>${esc(e.line)}</div>`).join("")}</div>`;
 }catch(e){$("#out").innerHTML=`<div class="card err">${esc(e.message)}</div>`}finally{$("#b").disabled=false}}
</script>
</body>
</html>
